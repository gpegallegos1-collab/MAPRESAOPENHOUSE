<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>MAPRESA | Open House</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080808;font-family:Arial,Helvetica,sans-serif;color:#fff;overflow:hidden}
.screen{position:fixed;inset:0}
#cover{display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(255,106,0,.24),transparent 28%),linear-gradient(135deg,#050505,#1b1b1b 55%,#070707)}
.cover-inner{width:min(700px,90vw);position:relative;z-index:2;animation:rise 1s ease both}
.logo-img{width:min(330px,68vw);height:auto;display:block;margin:0 auto 38px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
.open-house{font-size:clamp(42px,9vw,82px);font-weight:900;letter-spacing:.06em;margin:0 0 34px;text-shadow:0 6px 24px #000}
.open{border:0;background:#ff6a00;color:#fff;font-weight:900;font-size:clamp(17px,3vw,22px);padding:20px 42px;border-radius:999px;cursor:pointer;box-shadow:0 10px 35px #000,0 0 0 0 rgba(255,106,0,.55);animation:pulse 2s infinite}
.gear{position:absolute;border:1px solid rgba(255,106,0,.18);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:spin 18s linear infinite}.g1{width:380px;height:380px}.g2{width:620px;height:620px;animation-direction:reverse;animation-duration:28s}
#invite{opacity:0;visibility:hidden;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .65s,visibility .65s}
#invite.show{opacity:1;visibility:visible}
#invite img{display:block;width:auto;height:auto;max-width:100vw;max-height:100vh;object-fit:contain}
@media(max-width:600px){#invite{overflow:hidden;align-items:center;justify-content:center}#invite img{width:auto;height:100vh;max-width:100vw;max-height:100vh;min-height:0;object-fit:contain}.logo-img{margin-bottom:30px}.open-house{margin-bottom:28px}}
@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 10px 35px #000,0 0 0 0 rgba(255,106,0,.5)}50%{box-shadow:0 10px 35px #000,0 0 0 13px rgba(255,106,0,0)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="cover" class="screen">
  <div class="gear g1"></div><div class="gear g2"></div>
  <div class="cover-inner">
    <img class="logo-img" src="logo-mapresa.png" alt="MAPRESA">
    <h1 class="open-house">OPEN HOUSE</h1>
    <button class="open" onclick="openInvite()">ABRIR INVITACIÓN</button>
  </div>
</section>
<section id="invite" class="screen" aria-label="Invitación MAPRESA Open House">
  <img src="invitacion-mapresa.png" alt="Invitación MAPRESA Open House">
</section>
<script>
function openInvite(){
  document.getElementById('cover').style.display='none';
  document.getElementById('invite').classList.add('show');
  document.body.style.overflow='hidden';
}
</script>
</body>
</html>
