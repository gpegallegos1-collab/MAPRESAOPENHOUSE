<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6a00">
  <title>MAPRESA | Open House</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 110px;
      position: relative;
    }

    .invite {
      width: min(1100px, 100%);
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
      background: #111;
    }

    .invite img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Botón interactivo sobre la invitación */
    .rsvp {
      position: absolute;
      left: 50%;
      bottom: 5.5%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 250px;
      padding: 15px 25px;
      border-radius: 999px;
      background: #ff6a00;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: clamp(14px, 1.8vw, 21px);
      box-shadow: 0 10px 28px rgba(0,0,0,.4);
      border: 2px solid rgba(255,255,255,.9);
      transition: transform .2s ease, filter .2s ease;
      z-index: 2;
    }

    .rsvp:hover {
      transform: translateX(-50%) scale(1.04);
      filter: brightness(1.08);
    }

    .rsvp:active {
      transform: translateX(-50%) scale(.98);
    }

    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      padding: 12px;
      background: rgba(17,17,17,.92);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,.12);
    }

    .bar a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: min(420px, 100%);
      padding: 13px 18px;
      border-radius: 12px;
      background: #ff6a00;
      color: white;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }

    @media (max-width: 600px) {
      .page { padding: 0 0 82px; align-items: flex-start; }
      .invite {
        width: 100%;
        border-radius: 0;
        box-shadow: none;
      }
      .rsvp {
        min-width: 0;
        width: 70%;
        padding: 11px 12px;
        font-size: 13px;
        gap: 6px;
      }
    }

    @media (min-width: 601px) {
      .bar { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="invite" aria-label="Invitación MAPRESA Open House">
      <img src="invitacion-mapresa.png" alt="Invitación al Open House de MAPRESA">

      <a class="rsvp"
         href="https://wa.me/526565511692?text=Confirmo%20mi%20asistencia%20al%20Open%20House%20de%20MAPRESA%20el%2016%20de%20octubre%20de%202026."
         target="_blank"
         rel="noopener">
        ✓ CONFIRMAR ASISTENCIA
      </a>
    </section>
  </main>

  <div class="bar">
    <a href="https://wa.me/526565511692?text=Confirmo%20mi%20asistencia%20al%20Open%20House%20de%20MAPRESA%20el%2016%20de%20octubre%20de%202026."
       target="_blank" rel="noopener">
      ✓ Confirmar asistencia
    </a>
  </div>
</body>
</html>
