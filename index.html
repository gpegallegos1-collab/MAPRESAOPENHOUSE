<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAPRESA | Open House</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
#cover{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#050505;transition:.45s}
#cover.hide{opacity:0;visibility:hidden;pointer-events:none}
.cover-inner{text-align:center;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 18px 28px}
.logo{display:block;width:min(88vw,700px);height:auto;max-height:62vh;object-fit:contain;margin:0 auto 8px}
h1{font-size:clamp(52px,8.5vw,92px);line-height:.95;margin:0 0 38px;font-weight:900;letter-spacing:2px}
.open-btn{border:0;border-radius:14px;padding:20px 34px;min-width:min(78vw,380px);background:#ff7e18;color:#111;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.35)}
#invite{display:none;background:#050505;min-height:100vh;padding-bottom:28px}
#invite.show{display:block}
.invitation{width:100%;max-width:1080px;margin:0 auto}
.invitation img{display:block;width:100%;height:auto}
.actions{width:calc(100% - 28px);max-width:650px;margin:16px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:12px;text-decoration:none;font-size:15px;font-weight:900;text-align:center}
.confirm{background:#ff7e18;color:#111}
.maps{background:#171717;color:#fff;border:1px solid #ff7e18}
@media(max-width:600px){
  .cover-inner{padding:12px 10px 24px}
  .logo{width:96vw;max-width:560px;max-height:55vh;margin-bottom:4px}
  h1{font-size:clamp(44px,13vw,68px);margin-bottom:28px}
  .open-btn{font-size:18px;padding:18px 26px;min-width:76vw}
  .invitation{width:100vw}
  .actions{width:calc(100vw - 24px);gap:9px}
  .action{min-height:58px;font-size:13px}
}
@media(min-width:601px){
  #invite{padding:24px 0 40px}
  .invitation{border-radius:8px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
}
</style>
</head>
