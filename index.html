<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6a00">
  <title>MAPRESA | Open House</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{
      background:#0d0d0d;color:#fff;overflow-x:hidden;
      animation:pageIn 1s ease both;
    }
    .page{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:28px 16px 110px;position:relative;
    }
    .page:before{
      content:"";position:fixed;inset:-30%;pointer-events:none;
      background:radial-gradient(circle at 50% 50%,rgba(255,106,0,.16),transparent 28%);
      animation:glow 6s ease-in-out infinite alternate;
    }
    .invite{
      width:min(1100px,100%);position:relative;border-radius:18px;overflow:hidden;
      box-shadow:0 24px 70px rgba(0,0,0,.55);background:#111;
      animation:cardIn 1.1s cubic-bezier(.2,.8,.2,1) both;
    }
    .invite img{
      display:block;width:100%;height:auto;
      animation:photoIn 1.4s ease both;
    }
    /* brillo que cruza la invitación */
    .invite:after{
      content:"";position:absolute;top:-20%;left:-45%;width:25%;height:140%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
      transform:skewX(-18deg);pointer-events:none;
      animation:shine 5s ease-in-out 1.5s infinite;
    }
    .rsvp{
      position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      min-width:250px;padding:15px 25px;border-radius:999px;
      background:#ff6a00;color:#fff;text-decoration:none;font-weight:800;
      font-size:clamp(14px,1.8vw,21px);
      box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 0 rgba(255,106,0,.6);
      border:2px solid rgba(255,255,255,.9);z-index:3;
      animation:buttonIn 1s ease 1.2s both,pulse 2.2s ease-in-out 2.5s infinite;
      transition:transform .2s ease,filter .2s ease;
    }
    .rsvp:hover{transform:translateX(-50%) scale(1.05);filter:brightness(1.08)}
    .rsvp:active{transform:translateX(-50%) scale(.97)}
    .bar{
      position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;
      justify-content:center;padding:12px;background:rgba(17,17,17,.92);
      backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.12);
    }
    .bar a{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      width:min(420px,100%);padding:13px 18px;border-radius:12px;
      background:#ff6a00;color:white;text-decoration:none;font-weight:800;
      box-shadow:0 8px 24px rgba(0,0,0,.35);
      animation:pulse 2.4s ease-in-out infinite;
    }

    /* pequeños destellos */
    .spark{position:absolute;width:5px;height:5px;background:#ff6a00;border-radius:50%;
      box-shadow:0 0 14px #ff6a00;pointer-events:none;z-index:2;opacity:0}
    .s1{left:8%;top:18%;animation:spark 3.8s 1s infinite}
    .s2{left:82%;top:28%;animation:spark 4.4s 2s infinite}
    .s3{left:15%;top:73%;animation:spark 4s .3s infinite}
    .s4{left:90%;top:68%;animation:spark 3.5s 1.7s infinite}

    @keyframes pageIn{from{opacity:0}to{opacity:1}}
    @keyframes cardIn{from{opacity:0;transform:translateY(35px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes photoIn{from{opacity:0;filter:brightness(.55);transform:scale(1.025)}to{opacity:1;filter:brightness(1);transform:scale(1)}}
    @keyframes glow{from{transform:scale(.9);opacity:.45}to{transform:scale(1.12);opacity:1}}
    @keyframes shine{0%,55%{left:-45%}75%,100%{left:125%}}
    @keyframes buttonIn{from{opacity:0;transform:translate(-50%,25px)}to{opacity:1;transform:translate(-50%,0)}}
    @keyframes pulse{0%,100%{box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 0 rgba(255,106,0,.55)}50%{box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 13px rgba(255,106,0,0)}}
    @keyframes spark{0%,100%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.7)}60%{opacity:0;transform:scale(.7)}}

    @media (max-width:600px){
      .page{padding:0 0 82px;align-items:flex-start}
      .invite{width:100%;border-radius:0;box-shadow:none}
      .rsvp{min-width:0;width:70%;padding:11px 12px;font-size:13px;gap:6px}
    }
    @media (min-width:601px){.bar{display:none}}
    @media (prefers-reduced-motion:reduce){
      *,*:before,*:after{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="invite" aria-label="Invitación MAPRESA Open House">
      <img src="invitacion-mapresa.png" alt="Invitación al Open House de MAPRESA">
      <span class="spark s1"></span><span class="spark s2"></span>
      <span class="spark s3"></span><span class="spark s4"></span>
      <a class="rsvp"
        href="https://wa.me/526565511692?text=Confirmo%20mi%20asistencia%20al%20Open%20House%20de%20MAPRESA%20el%2016%20de%20octubre%20de%202026."
        target="_blank" rel="noopener">✓ CONFIRMAR ASISTENCIA</a>
    </section>
  </main>
  <div class="bar">
    <a href="https://wa.me/526565511692?text=Confirmo%20mi%20asistencia%20al%20Open%20House%20de%20MAPRESA%20el%2016%20de%20octubre%20de%202026."
       target="_blank" rel="noopener">✓ Confirmar asistencia</a>
  </div>
</body>
</html>
