<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>MAPRESA | Open House</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#090909;color:#fff;overflow:hidden}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .9s,visibility .9s}
#cover{z-index:5;background:
 radial-gradient(circle at 50% 45%,rgba(255,106,0,.22),transparent 30%),
 linear-gradient(135deg,#080808,#1b1b1b 55%,#090909)}
#cover.hidden{opacity:0;visibility:hidden;pointer-events:none}
.cover-inner{text-align:center;width:min(700px,90%);animation:rise 1.2s ease both}
.logo{font-size:clamp(55px,12vw,125px);font-weight:900;letter-spacing:.06em}
.orange{color:#ff6a00}.line{height:5px;width:90px;background:#ff6a00;margin:18px auto 25px;border-radius:10px}
.kicker{font-size:clamp(14px,2vw,20px);letter-spacing:.35em;color:#ddd;margin-bottom:12px}
.title{font-size:clamp(26px,5vw,52px);font-weight:900;margin:0 0 8px}
.date{font-size:clamp(18px,3vw,30px);color:#ff6a00;font-weight:800;margin-bottom:32px}
.open{border:0;background:#ff6a00;color:#fff;font-weight:900;font-size:16px;
padding:16px 34px;border-radius:999px;cursor:pointer;box-shadow:0 0 0 0 rgba(255,106,0,.55);
animation:pulse 2s infinite;transition:.2s}
.open:hover{transform:scale(1.06)}
.gear{position:absolute;border:1px solid rgba(255,106,0,.2);border-radius:50%;animation:spin 18s linear infinite}
.g1{width:330px;height:330px}.g2{width:520px;height:520px;animation-direction:reverse;animation-duration:28s}
#inviteScreen{z-index:2;opacity:0;visibility:hidden;overflow:auto;padding:25px 15px 90px}
#inviteScreen.show{opacity:1;visibility:visible}
.card{width:min(1100px,100%);position:relative;border-radius:18px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.6);animation:cardIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.card img{display:block;width:100%;height:auto}
.card:after{content:"";position:absolute;top:-20%;left:-45%;width:24%;height:140%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-18deg);
animation:shine 5s ease 1.5s infinite;pointer-events:none}
.rsvp{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);
background:#ff6a00;color:white;text-decoration:none;font-weight:900;border:2px solid white;
padding:14px 25px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 30px #0008;
animation:pulse 2.2s 2s infinite;z-index:3}
.back{position:fixed;left:18px;top:18px;z-index:10;background:#111d;color:#fff;border:1px solid #ffffff33;
padding:10px 15px;border-radius:12px;cursor:pointer;backdrop-filter:blur(8px)}
.particle{position:fixed;width:4px;height:4px;border-radius:50%;background:#ff6a00;opacity:0;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(45px) scale(.96)}to{opacity:1;transform:none}}
@keyframes shine{0%,55%{left:-45%}75%,100%{left:125%}}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px #0008,0 0 0 0 rgba(255,106,0,.55)}50%{box-shadow:0 10px 30px #0008,0 0 0 14px rgba(255,106,0,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){
 #inviteScreen{padding:0 0 80px;align-items:flex-start}
 .card{border-radius:0;width:100%;box-shadow:none}
 .rsvp{font-size:13px;padding:11px 15px;width:72%;text-align:center}
 .back{font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="cover" class="screen">
  <div class="gear g1"></div><div class="gear g2"></div>
  <div class="cover-inner">
    <div class="logo">MAPRESA</div>
    <div class="line"></div>
    <div class="kicker">OPEN HOUSE</div>
    <div class="title">Tecnología · Maquinaria · Industria</div>
    <div class="date">16 DE OCTUBRE · 1:00 PM</div>
    <button class="open" onclick="openInvite()">ABRIR INVITACIÓN</button>
  </div>
</div>

<div id="inviteScreen" class="screen">
  <button class="back" onclick="backCover()">← Regresar</button>
  <div class="card">
    <img src="invitacion-mapresa.png" alt="Invitación MAPRESA Open House">
    <a class="rsvp"
      href="https://wa.me/526565511692?text=Confirmo%20mi%20asistencia%20al%20Open%20House%20de%20MAPRESA%20el%2016%20de%20octubre%20de%202026."
      target="_blank" rel="noopener">✓ CONFIRMAR ASISTENCIA</a>
  </div>
</div>

<script>
function openInvite(){
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('inviteScreen').classList.add('show');
  document.body.style.overflow='auto';
}
function backCover(){
  document.getElementById('inviteScreen').classList.remove('show');
  document.getElementById('cover').classList.remove('hidden');
  document.body.style.overflow='hidden';
}
</script>
</body>
</html>
