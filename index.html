<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAPRESA | Open House</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
#cover{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#050505;transition:.45s}
#cover.hide{opacity:0;visibility:hidden;pointer-events:none}
.cover-inner{text-align:center;width:90vw;max-width:700px}
.logo{display:block;width:min(78vw,430px);max-height:300px;object-fit:contain;margin:0 auto 30px}
h1{font-size:clamp(46px,8vw,82px);line-height:.95;margin:0 0 36px;font-weight:900;letter-spacing:3px}
.open-btn{border:0;border-radius:12px;padding:18px 30px;min-width:min(82vw,360px);background:#ff7e18;color:#111;font-size:20px;font-weight:900;cursor:pointer}
#invite{display:none;background:#050505;min-height:100vh;padding-bottom:28px}
#invite.show{display:block}
.invitation{width:100%;max-width:1080px;margin:0 auto}
.invitation img{display:block;width:100%;height:auto}
.actions{width:calc(100% - 28px);max-width:650px;margin:16px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action{display:flex;align-items:center;justify-content:center;min-height:62px;border-radius:12px;text-decoration:none;font-size:15px;font-weight:900;text-align:center}
.confirm{background:#ff7e18;color:#111}
.maps{background:#171717;color:#fff;border:1px solid #ff7e18}
@media(max-width:600px){
.logo{width:min(78vw,360px);margin-bottom:26px}
h1{font-size:48px;margin-bottom:30px}
.open-btn{font-size:18px}
.invitation{width:100vw}
.actions{width:calc(100vw - 24px);gap:9px}
.action{min-height:58px;font-size:13px}
}
@media(min-width:601px){
#invite{padding:24px 0 40px}
.invitation{border-radius:8px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
}
</style>
</head>
<body>
<section id="cover">
 <div class="cover-inner">
  <img class="logo" src="logo-mapresa.png" alt="MAPRESA">
  <h1>OPEN HOUSE</h1>
  <button class="open-btn" id="open">ABRIR INVITACIÓN</button>
 </div>
</section>

<main id="invite">
 <div class="invitation">
  <img src="invitacion-mobile.png" alt="Invitación MAPRESA Open House">
 </div>
 <div class="actions">
  <a class="action confirm" href="https://wa.me/526565511692?text=Confirmo%20mi%20asistencia%20al%20Open%20House%20de%20MAPRESA%20el%2016%20de%20octubre%20de%202026." target="_blank" rel="noopener">CONFIRMAR ASISTENCIA</a>
  <a class="action maps" href="https://www.google.com/maps/search/?api=1&query=Calle%20Cordillera%20del%20Cáucaso%206767%2C%20Ciudad%20Juárez%2C%20Mexico%2C%2032650" target="_blank" rel="noopener">ABRIR UBICACIÓN</a>
 </div>
</main>
<script>
document.getElementById('open').onclick=()=>{
 document.getElementById('cover').classList.add('hide');
 document.getElementById('invite').classList.add('show');
 window.scrollTo(0,0);
};
</script>
</body>
</html>
