<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>MAPRESA | Open House</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080808;font-family:Arial,Helvetica,sans-serif;color:#fff;overflow:hidden}
.screen{position:fixed;inset:0}
#cover{display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(255,106,0,.24),transparent 28%),linear-gradient(135deg,#050505,#1b1b1b 55%,#070707)}
.cover-inner{width:min(700px,90vw);position:relative;z-index:2;animation:rise 1s ease both}
.logo-img{object-fit:contain;width:min(330px,68vw);height:auto;display:block;margin:0 auto 38px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
.open-house{font-size:clamp(42px,9vw,82px);font-weight:900;letter-spacing:.06em;margin:0 0 34px;text-shadow:0 6px 24px #000}
.open{border:0;background:#ff6a00;color:#fff;font-weight:900;font-size:clamp(17px,3vw,22px);padding:20px 42px;border-radius:999px;cursor:pointer;box-shadow:0 10px 35px #000,0 0 0 0 rgba(255,106,0,.55);animation:pulse 2s infinite}
.gear{position:absolute;border:1px solid rgba(255,106,0,.18);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:spin 18s linear infinite}.g1{width:380px;height:380px}.g2{width:620px;height:620px;animation-direction:reverse;animation-duration:28s}
#invite{opacity:0;visibility:hidden;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .65s,visibility .65s}
#invite.show{opacity:1;visibility:visible}
#invite{overflow:hidden}
#invite img{
  display:block;
  width:100vw;
  height:100vh;
  max-width:none;
  max-height:none;
  object-fit:cover;
  object-position:center center;
}
@media(max-width:600px){
  #invite{overflow:hidden}
  #invite img{
    width:100vw;
    height:100vh;
    object-fit:cover;
    object-position:center center;
  }
  .logo-img{object-fit:contain;margin-bottom:30px}.open-house{margin-bottom:28px}
}
@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 10px 35px #000,0 0 0 0 rgba(255,106,0,.5)}50%{box-shadow:0 10px 35px #000,0 0 0 13px rgba(255,106,0,0)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<style>
/* V11: controls on the invitation screen, while keeping the invitation fullscreen */
#locationPanel{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:50;
  width:min(92vw,430px);
  padding:14px 16px 16px;
  border-radius:16px;
  background:rgba(5,5,5,.90);
  border:1px solid rgba(255,126,24,.75);
  box-shadow:0 8px 30px rgba(0,0,0,.45);
  text-align:center;
  box-sizing:border-box;
}
.location-title{
  color:#ff7e18;
  font-size:17px;
  font-weight:900;
  letter-spacing:1.5px;
  margin-bottom:5px;
}
.location-address{
  color:#fff;
  font-size:13px;
  line-height:1.35;
  margin-bottom:11px;
}
.location-btn{
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:13px 16px;
  border-radius:10px;
  background:#ff7e18;
  color:#111;
  text-decoration:none;
  font-size:14px;
  font-weight:900;
  letter-spacing:.5px;
}
.location-btn:active{transform:scale(.98)}
@media(max-width:600px){
  #locationPanel{
    bottom:12px;
    width:calc(100vw - 24px);
    padding:12px 12px 13px;
  }
  .location-address{font-size:12px}
  .location-btn{padding:12px 10px;font-size:13px}
}
</style>

</head>
<body>
<section id="cover" class="screen">
  <div class="gear g1"></div><div class="gear g2"></div>
  <div class="cover-inner">
    <img class="logo-img" src="logo-mapresa.png" alt="MAPRESA">
    <h1 class="open-house">OPEN HOUSE</h1>
    <button class="open" onclick="openInvite()">ABRIR INVITACIÓN</button>
  </div>
</section>
<section id="invite" class="screen" aria-label="Invitación MAPRESA Open House">
  <img src="invitacion-mapresa.png" alt="Invitación MAPRESA Open House">
</section>
<script>
function openInvite(){
  document.getElementById('cover').style.display='none';
  document.getElementById('invite').classList.add('show');
  document.body.style.overflow='hidden';
}
</script>

<div id="locationPanel">
  <div class="location-title">📍 UBICACIÓN</div>
  <div class="location-address">Calle Cordillera del Cáucaso 6767<br>Ciudad Juárez, Mexico, 32650</div>
  <a class="location-btn" href="https://www.google.com/maps/search/?api=1&query=Calle%20Cordillera%20del%20Cáucaso%206767%2C%20Ciudad%20Juárez%2C%20Mexico%2C%2032650" target="_blank" rel="noopener">ABRIR UBICACIÓN EN MAPS</a>
</div>

</body>
</html>
